name: AICertify CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      # The gopal policy library is a submodule, and the tests that matter most
      # read it: which decision rule each policy publishes, and whether a true
      # verdict means compliant or means a concern was detected. Without it,
      # those tests were passing vacuously against an empty index.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"  # Updated to match project requirements

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: poetry install

      # Dependabot #199 / GHSA-8mgp-746c-j5xp has no patched NLTK release yet.
      # Keep NLTK out of the default install until upstream publishes one; this
      # fails if a future dependency silently reintroduces an affected release.
      - name: Assert NLTK Is Not Installed
        run: |
          poetry run python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          try:
              installed = version("nltk")
          except PackageNotFoundError:
              raise SystemExit(0)

          raise SystemExit(
              f"Unsafe default dependency graph: NLTK {installed} is installed; "
              "Dependabot #199 has no patched NLTK release yet"
          )
          PY

      - name: Run Code Linting with Pre-commit
        run: |
          poetry run pre-commit run --all-files

      - name: Verify Package Installation
        run: |
          poetry run python -c "import aicertify; print(f'AICertify version: {aicertify.__version__}')"

      # Model-card scoring runs GOPAL rather than a copy of it, so the binary
      # is needed to test that path at all. Without it those tests skip, and a
      # capability nobody exercises in CI is a capability nobody is checking.
      # Pinned to the version gopal's own CI uses.
      - name: Install OPA
        env:
          OPA_VERSION: v1.20.1
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64"
          chmod 755 opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Run Basic Tests
        run: poetry run pytest tests/ -v
